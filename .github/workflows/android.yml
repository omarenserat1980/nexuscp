name: Android checks
on:
  push:
    branches: [master, main, nexuscp/session-isolation-v19]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0
      - uses: gradle/actions/setup-gradle@v6
      - name: Stamp the build number
        run: echo "NEXUSCP_BUILD_NUMBER=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
      - name: Unit tests and lint
        run: ./gradlew testDebugUnitTest lintDebug --stacktrace
      - name: Debug APK
        run: ./gradlew assembleDebug --stacktrace
      - name: Verify debug APK
        if: success()
        run: |
          set -euo pipefail
          APK=$(ls build/outputs/apk/debug/*.apk | head -1)
          echo "APK: $APK"
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          "$AAPT2" dump badging "$APK" | grep -E "^package:|^minSdkVersion:|^targetSdkVersion:|^application-label:" || true
          if unzip -l "$APK" | grep -E "offline-mfi"; then
            echo "ERROR: offline-mfi assets must not be packaged; identity is embedded in source" >&2
            exit 1
          fi
          echo "offline-mfi assets: absent (expected)"
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: nexuscp-debug-apk
          path: build/outputs/apk/debug/*.apk
          if-no-files-found: warn
